name: nacional-puja

# Un administrador d'un club ha pujat un PDF de la Lliga Nacional des de la seva
# aplicació (Admin → Lliga Nacional). L'aplicació el deixa en un magatzem de pas
# (Cloudflare R2) i engega aquest procés, que:
#
#   1. el baixa i el reconeix (jornada, classificació de jugadors, calendari o
#      alineacions): `fcbillar nacional-puja`;
#   2. si és bo, el desa a `fonts/nacional/…` i en fa un commit, perquè la càrrega
#      de cada nit el torni a tenir;
#   3. ingereix les fonts i publica NOMÉS la Lliga Nacional;
#   4. deixa al magatzem un fitxer d'estat que l'aplicació llegeix, i n'esborra
#      el PDF.
#
# PER QUÈ UN MAGATZEM DE PAS I NO UN COMMIT DIRECTE DES DE L'APLICACIÓ: l'«orden
# de fuerza» porta adreces, telèfons i correus de directius i no pot entrar al
# repositori ni un moment. Aquí se'n treu el CSV net i l'original s'esborra.
#
# No puja la base al release: la de cada nit torna a llegir totes les fonts, que
# és d'on surt tot això, o sigui que no hi ha res a conservar.
#
# REQUISITS (secrets del repositori): els de sempre de Neon, i els del magatzem
# —R2_ACCOUNT_ID, R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_BUCKET—.

on:
  workflow_dispatch:
    inputs:
      clau:
        description: "On és el PDF al magatzem: nacional-pujades/<club>/<id>.pdf"
        required: true
      divisio:
        description: "honor, 1 o 2"
        required: false
        default: "1"

# El mateix grup que la càrrega de cada nit: totes dues publiquen la Lliga
# Nacional i totes dues baixen la base, i no s'han de trepitjar.
concurrency:
  group: reingest
  cancel-in-progress: false

jobs:
  nacional-puja:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEON_DATA_API_URL: ${{ secrets.NEON_DATA_API_URL }}
      NEON_SERVICE_ROLE_TOKEN: ${{ secrets.NEON_SERVICE_ROLE_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: "true"
      R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      CLAU: ${{ github.event.inputs.clau }}
      DIVISIO: ${{ github.event.inputs.divisio || '1' }}
      STATE_TAG: fcb-state
    steps:
      # Res del que ve de fora no es fa servir sense mirar-ho. La clau només hi és
      # per deixar constància de qui ha engegat el procés: el que es processa són
      # TOTS els documents pendents del magatzem (vegeu scripts/nacional_pujades.py).
      - name: Comprova el que es demana
        run: |
          if ! [[ "$CLAU" =~ ^nacional-pujades/[a-z0-9-]+/[a-z0-9-]+\.pdf$ ]]; then
            echo "Clau no vàlida."; exit 1
          fi
          if ! [[ "$DIVISIO" =~ ^(honor|1|2)$ ]]; then
            echo "Divisió no vàlida."; exit 1
          fi

      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Reconeix els documents pendents
        id: reconeix
        run: uv run --no-dev python scripts/nacional_pujades.py reconeix

      - name: Desa les fonts al repositori
        if: steps.reconeix.outputs.bons != '0'
        run: |
          git config user.name "fcbillar-bot"
          git config user.email "fcbillar-bot@users.noreply.github.com"
          git add fonts/nacional
          if git diff --cached --quiet; then
            echo "Els documents ja hi eren, idèntics."
          else
            git commit -m "Lliga Nacional: documents pujats des de l'aplicació"
            # La càrrega de cada nit no fa commits, però algú pot haver pujat res
            # mentre aquest procés esperava torn.
            git pull --rebase --autostash
            git push
          fi

      - name: Baixa l'estat del release (BD)
        if: steps.reconeix.outputs.bons != '0'
        run: |
          gh release download "$STATE_TAG" --dir data --pattern 'fcbillar.db' --clobber || true
          # Si falta la principal, l'anterior que hi deixa la reingesta.
          if [ ! -f data/fcbillar.db ]; then
            echo "::warning title=Sense fcbillar.db::Al release no hi ha fcbillar.db; es fa servir fcbillar-anterior.db."
            gh release download "$STATE_TAG" --dir data --pattern 'fcbillar-anterior.db' --clobber
            mv data/fcbillar-anterior.db data/fcbillar.db
          fi

      - name: Ingereix i publica la Lliga Nacional
        id: publica
        if: steps.reconeix.outputs.bons != '0'
        run: |
          set +e
          uv run --no-dev fcbillar ingest-nacional-fonts && uv run --no-dev fcbillar publish-nacional
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      # L'aplicació només sap què ha passat pel fitxer d'estat de cada document.
      - name: Deixa l'estat per a l'aplicació i esborra els PDF de pas
        if: always()
        env:
          RC_PUBLICA: ${{ steps.publica.outputs.rc }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run --no-dev python scripts/nacional_pujades.py tanca
