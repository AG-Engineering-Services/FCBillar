name: Traductor de vídeos

# Buida la cua `fcbillar.video_traduccio` que omplen els usuaris des de la PWA
# (Aprèn → Traductor): transcriu amb el Whisper de NVIDIA, tradueix al català
# amb un LLM de NVIDIA, fa la veu en off amb Piper i penja l'mp3 al release
# `traduccions`. Tot gratuït: el repositori és públic (minuts d'Actions sense
# límit) i els assets d'un release no costen res. Vegeu
# scripts/traductor/tradueix.py i la migració 0022.
#
# Quan no hi ha res pendent, la primera consulta ho diu i el job acaba en segons.
#
# YouTube bloqueja les IP de GitHub («Sign in to confirm you're not a bot»): el
# primer tret real va fallar així. Les descàrregues surten per Cloudflare WARP
# (gratuït, sense compte) en mode proxy; provat el 24/09/2026, directe 0/2 i per
# WARP 2/2. Instagram i Facebook poden demanar sessió igualment: aquestes
# peticions acaben 'error' amb el missatge de yt-dlp, que la PWA mostra.
#
# REQUISITS:
#   - Secrets: NEON_DATA_API_URL, NEON_SERVICE_ROLE_TOKEN (els mateixos que la
#     reingesta) i NVIDIA_API_KEY (build.nvidia.com, gratuïta).
#   - El release `traduccions` es crea sol la primera vegada.

on:
  schedule:
    # Cada quart d'hora, als minuts 7/22/37/52: GitHub encua tots els crons de :00
    # alhora i és el primer que descarta quan va carregat (vegeu publish-live-opens.yml).
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: traductor
  cancel-in-progress: false

jobs:
  tradueix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write          # per penjar els mp3 al release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      NEON_DATA_API_URL: ${{ secrets.NEON_DATA_API_URL }}
      NEON_SERVICE_ROLE_TOKEN: ${{ secrets.NEON_SERVICE_ROLE_TOKEN }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      PIPER_MODELS: ${{ github.workspace }}/.piper
      PYTHONIOENCODING: utf-8
      YTDLP_PROXY: socks5://127.0.0.1:40000
    steps:
      - name: Hi ha feina?
        id: cua
        run: |
          base="${NEON_DATA_API_URL%/}"; [[ "$base" == */rest/v1 ]] || base="$base/rest/v1"
          n=$(curl -sf "$base/video_traduccio?select=id&estat=in.(pendent,processant)&limit=1" \
                -H "Authorization: Bearer $NEON_SERVICE_ROLE_TOKEN" -H "Accept-Profile: fcbillar" \
              | jq length)
          echo "pendents=$n" >> "$GITHUB_OUTPUT"

      # Els mp3 dels vídeos que l'admin ha eliminat a la PWA (migració 0024). Va
      # abans del guard: s'ha de fer encara que no hi hagi res a traduir. Si la
      # consulta falla (p. ex. la memòria cau de Neon), curl -f atura el pas i no
      # s'esborra res: una llista buida per error ho eliminaria tot.
      - name: Neteja els àudios i vídeos de traduccions eliminades
        continue-on-error: true   # que una neteja fallida no deixi la cua sense traduir
        run: |
          base="${NEON_DATA_API_URL%/}"; [[ "$base" == */rest/v1 ]] || base="$base/rest/v1"
          resposta=$(curl -sf "$base/video_traduccio?select=audio_url,video_url&or=(audio_url.not.is.null,video_url.not.is.null)" \
            -H "Authorization: Bearer $NEON_SERVICE_ROLE_TOKEN" -H "Accept-Profile: fcbillar")
          vius=$(jq -r '.[] | (.audio_url, .video_url) | select(.) | split("/") | last' <<<"$resposta")
          assets=$(gh release view traduccions -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null || true)
          for nom in $assets; do
            grep -qxF "$nom" <<<"$vius" && continue
            echo "esborro $nom"
            gh release delete-asset traduccions "$nom" -R "$GITHUB_REPOSITORY" -y
          done

      - uses: actions/checkout@v4
        if: steps.cua.outputs.pendents != '0'

      - uses: astral-sh/setup-uv@v6
        if: steps.cua.outputs.pendents != '0'

      - name: Veu catalana (Piper) en memòria cau
        if: steps.cua.outputs.pendents != '0'
        uses: actions/cache@v4
        with:
          path: .piper
          key: piper-ca_ES-upc_ona-medium

      - name: Release de les traduccions
        if: steps.cua.outputs.pendents != '0'
        run: |
          gh release view traduccions >/dev/null 2>&1 || gh release create traduccions \
            --prerelease --title "Traduccions de vídeos" \
            --notes "Veus en off en català del traductor de la PWA. Les escriu el workflow traductor.yml; no editar a mà."

      - name: ffmpeg i Cloudflare WARP en mode proxy (per a yt-dlp)
        if: steps.cua.outputs.pendents != '0'
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg             | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main"             | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          # ffmpeg tambe: la imatge ubuntu-latest (24.04) no el porta.
          sudo apt-get update -qq && sudo apt-get install -y -qq cloudflare-warp ffmpeg
          sleep 3
          warp-cli --accept-tos registration new
          warp-cli --accept-tos mode proxy
          warp-cli --accept-tos connect
          sleep 5
          curl -sf --socks5-hostname 127.0.0.1:40000 https://www.cloudflare.com/cdn-cgi/trace | grep '^warp=on'

      - name: Tradueix
        if: steps.cua.outputs.pendents != '0'
        run: uv run scripts/traductor/tradueix.py --max 3
