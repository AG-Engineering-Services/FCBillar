name: Publish live opens

# Bolca l'estat EN VIU dels Opens en curs (totes les modalitats) a Supabase
# (taula fcbillar.open_live), perquè l'app web en mostri el seguiment en temps
# real. Només llegeix pàgines públiques de la federació (sense login) i escriu a
# Supabase amb la service_role.
#
# REQUISIT: secrets al repo (Settings → Secrets and variables → Actions):
#   - NEON_DATA_API_URL
#   - NEON_SERVICE_ROLE_TOKEN
#
# CADÈNCIA: cada execució fa un BUCLE INTERN que refresca cada ~2 min; el bucle
# és llarg (~5 h) a posta: si GitHub deixa caure trets, l'últim que SÍ va arrencar
# segueix publicant fins que el següent el rellevi (cancel-in-progress). N'hi ha
# prou que arrenqui ~1 tret cada poques hores.
#
# TRES DEFENSES contra el cron de GitHub (que és "best effort" i deixa caure
# trets sencers quan hi ha càrrega):
#   1) MINUTS ESTRANYS (:11 i :41), mai :00 ni :30. Tothom programa a :00/:30;
#      GitHub encua tots aquests crons alhora i és el primer que descarta. Amb
#      minut 0 el 2026-07-18 el primer tret del dia no va entrar fins a les
#      09:37 UTC (11:37 local!) i el 2026-07-25 a les 07:17 UTC encara no havia
#      entrat cap — amb les partides ja començades.
#   2) FINESTRA AMPLIADA a partir de les 03 UTC: molts trets independents abans
#      que comencin les partides; només cal que n'entri UN. Abans de les 06 UTC
#      el bucle espera sense raspar la federació (no fa feina en va).
#   3) AUTOENCADENAMENT: en acabar bé el bucle, la pròpia execució es torna a
#      llançar (workflow_dispatch amb GITHUB_TOKEN SÍ crea execució nova). Així
#      la cadena es manté viva encara que GitHub no torni a disparar cap cron.
#      Només en `success()`: si l'execució ha estat CANCEL·LADA (rellevada per un
#      tret nou) no encadena, perquè si no es cancel·larien en bucle l'una a
#      l'altra.
#
# Finestra: DISSABTES i DIUMENGES. Es publica de 06 a 21 UTC (08–23 local a
# l'estiu, CEST=UTC+2; 07–22 a l'hivern, CET=UTC+1). Dies: 6=ds, 0=dg.

on:
  schedule:
    - cron: '11 3-20 * * 6,0'    # cada hora al minut 11 (ds/dg)
    - cron: '41 3-10 * * 6,0'    # doble tret al matí, al minut 41
  workflow_dispatch: {}

# Un nou tret reinicia el bucle des de zero (sempre dades fresques, sense pila).
concurrency:
  group: publish-live-opens
  cancel-in-progress: true

permissions:
  contents: read
  actions: write                 # autoencadenament (gh workflow run)

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 320   # 300 del bucle + l'última espera (fins a 10') + preparació
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Publish live opens (bucle intern ~2 min durant ~5 h)
        env:
          NEON_DATA_API_URL: ${{ secrets.NEON_DATA_API_URL }}
          NEON_C3B_DATA_API_URL: ${{ secrets.NEON_C3B_DATA_API_URL }}
          NEON_SERVICE_ROLE_TOKEN: ${{ secrets.NEON_SERVICE_ROLE_TOKEN }}
        run: |
          END=$(( SECONDS + 18000 ))   # ~5 h: el bucle no acaba abans del següent tret (GitHub estrangula els crons; cancel-in-progress reinicia)
          i=0
          # Publicacions fallides SEGUIDES. Fins a l'octubre de 2026 aquí hi deia
          # `|| true`: el lector es va trencar amb el web nou de la federació i
          # aquest job va estar setmanes en verd sense publicar res. Ara una
          # passada que falla deixa una anotació, i cinc de seguides (uns deu
          # minuts) fan fallar el job. Una de sola no: en ple open una pàgina que
          # no respon un cop no ha d'aturar el seguiment.
          FAILS=0
          MAX_FAILS=5
          while [ "$SECONDS" -lt "$END" ]; do
            H=$((10#$(date -u +%H)))   # `10#` evita l'error d'octal amb 08/09
            if [ "$H" -ge 6 ] && [ "$H" -le 21 ]; then
              i=$(( i + 1 ))
              echo "::group::publicació #$i (t=${SECONDS}s, ${H}h UTC)"
              RC=0
              uv run --no-dev fcbillar publish-live-opens || RC=$?
              echo "::endgroup::"
              if [ "$RC" -eq 0 ]; then
                FAILS=0
              else
                FAILS=$(( FAILS + 1 ))
                if [ "$RC" -eq 3 ]; then
                  echo "::error::publicació #$i: una pàgina de la federació no té la forma esperada (el web pot haver canviat). $FAILS de $MAX_FAILS seguides."
                else
                  echo "::warning::publicació #$i fallida (exit=$RC). $FAILS de $MAX_FAILS seguides."
                fi
                if [ "$FAILS" -ge "$MAX_FAILS" ]; then
                  echo "::error::$MAX_FAILS publicacions fallides seguides: el seguiment d'opens en directe NO funciona."
                  exit 1
                fi
              fi
              NAP=120
            else
              # Trets de matinada: mantenim viva l'execució per cobrir l'inici de
              # les partides, però sense raspar la federació per no res.
              echo "fora de la finestra de joc (${H}h UTC) — espero sense raspar"
              NAP=600
            fi
            # `if` i no `A && B`: amb `set -e` (shell per defecte d'Actions) una
            # llista `&&` que falla deixa el bucle amb estat != 0 i el pas
            # fallaria just al final — i llavors no s'encadenaria el següent tret.
            if [ "$SECONDS" -lt "$END" ]; then sleep "$NAP"; fi
          done

      # Autoencadenament: si el bucle ha acabat sencer (ningú l'ha rellevat), es
      # torna a llançar per no deixar cap forat si GitHub no dispara cap cron.
      # `success()` a posta: una execució CANCEL·LADA no ha d'encadenar (es
      # cancel·larien mútuament en bucle).
      - name: Encadena el següent tret
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DOW=$(date -u +%u)           # 1=dl … 6=ds, 7=dg
          H=$((10#$(date -u +%H)))
          if { [ "$DOW" = "6" ] || [ "$DOW" = "7" ]; } && [ "$H" -lt 21 ]; then
            echo "Encadeno el següent tret (dow=$DOW, ${H}h UTC)."
            gh workflow run publish-live-opens.yml --ref "${GITHUB_REF_NAME}"
          else
            echo "Fora de finestra (dow=$DOW, ${H}h UTC) — no encadeno."
          fi
