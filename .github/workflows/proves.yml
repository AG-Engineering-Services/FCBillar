name: Proves

# Executa les proves a cada push i a cada pull request.
#
# Fins al 6 de setembre de 2026 no hi havia cap workflow que en corregués cap:
# les 923 de Python i les 69 del web només s'executaven a l'ordinador de qui
# escrivia el codi. Unes proves que no corren no protegeixen de res, i menys en
# un repositori on la ingesta la fa una màquina cada nit.
#
# El format es comprova només a `src/fcbillar` i `tests`, que hi són nets: el
# paquet `fcb_opens` i uns quants guions arrosseguen deute d'abans -42 i 17
# fitxers- i posar-los-hi deixaria el job vermell des del primer dia, que és la
# manera seguríssima que ningú no el torni a mirar mai.
#
# `ruff check` no hi és per la mateixa raó, i amb més motiu: 117 avisos.
# Netejar-ho és una feina a part, i quan es faci s'amplia aquesta llista.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch: {}

# Un push nou deixa sense sentit el que corria: es cancel·la.
concurrency:
  group: proves-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Format
        run: uv run ruff format --check src/fcbillar tests

      - name: Proves
        run: uv run python -m pytest tests/ -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    # SvelteKit genera els tipus de `$env/static/public` a partir de les
    # variables que hi ha al moment de fer el `sync`. Aquí no hi ha `.env`, o
    # sigui que sense això els tipus no porten aquestes dues i la comprovació es
    # queixa que no existeixen. Els valors no serveixen per a res: no s'hi
    # connecta, només es compilen els tipus.
    env:
      PUBLIC_NEON_DATA_API_URL: https://exemple.invalid/neondb
      PUBLIC_NEON_ANON_TOKEN: nomes-per-generar-els-tipus
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instal·la
        run: npm ci

      # SvelteKit genera `.svelte-kit/tsconfig.json`, del qual penja el
      # `tsconfig.json` del projecte. En local hi és de compilacions anteriors i
      # en una màquina neta no, o sigui que sense això la comprovació de tipus
      # falla dient que no troba el seu propi fitxer de configuració.
      - name: Prepara SvelteKit
        run: npx svelte-kit sync

      - name: Tipus
        # Només els errors: els avisos que queden són previs i coneguts.
        run: npx svelte-check --threshold error --output human

      - name: Proves
        run: npx vitest run
