<!doctype html>
<html lang="ca" class="h-full">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg?v=2" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="%sveltekit.assets%/icon-192.png" />
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!-- Superfície clara del sistema (bitum-050). El script de sota la
		     canvia per la fosca si toca. -->
		<meta name="theme-color" content="#F4F6F3" />
		<script>
			// Aplica el tema ABANS del primer pintat per evitar el flaix blanc.
			// Mateixa lògica que $lib/theme.ts.
			//
			// Hi ha TRES estats, no dos: si l'usuari ha triat, es marca a
			// `data-theme` i mana per damunt del sistema; si no ha triat, no es
			// marca res i els tokens segueixen `prefers-color-scheme`. La classe
			// `dark` porta l'estat ja resolt, que és el que llegeix Tailwind.
			(function () {
				try {
					var t = localStorage.getItem('theme');
					if (t === 'dark' || t === 'light') {
						document.documentElement.setAttribute('data-theme', t);
					}
					var dark = t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches);
					if (dark) {
						document.documentElement.classList.add('dark');
						var m = document.querySelector('meta[name="theme-color"]');
						if (m) m.setAttribute('content', '#161917');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="h-full bg-slate-50 text-slate-900 antialiased dark:bg-slate-900 dark:text-slate-100"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
